upload_max_filesize = 60M
post_max_size = 64M

; A phone camera shot is 4-8 MB and a short .mov is tens of MB, so the old
; 10M/12M pair rejected an ordinary product upload from the admin's phone
; before Laravel ever saw the request (ValidatePostSize -> 413, with PHP
; discarding $_POST and $_FILES wholesale). Keep these above the 20 MB the
; per-file validation in ProductController allows, with room for several
; files in one submit.
max_file_uploads = 50

; The product edit form posts every variation back with the full JSON of each
; already-uploaded media item and the complete option catalogue of every
; attribute, so one save is easily thousands of POST variables. At the PHP
; default of 1000 the tail was silently dropped, and since 'attributes' is
; serialized last inside each variation it was the first thing lost -- that is
; the "Undefined array key attributes" 500 in ProductController::update().
max_input_vars = 10000
